name: bug report
description: report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: thanks for taking the time to report a bug.
  - type: textarea
    id: what-happened
    attributes:
      label: what happened?
      description: tell us what went wrong and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: steps to reproduce
      description: list steps or describe how to trigger it.
    validations:
      required: true
